<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopa | Catálogo Premium</title>
    <meta name="description" content="Catálogo de nuestros productos. Haz tu pedido directamente por WhatsApp.">
    
    <!-- Etiquetas SEO (Open Graph) para vista previa al compartir -->
    <meta property="og:title" content="Top Dopa | Catálogo Premium">
    <meta property="og:description" content="Catálogo de nuestros productos. Haz tu pedido directamente por WhatsApp.">
    <meta property="og:image" content="https://topdopa-demo.pages.dev/fotos/portada.jpg">
    <meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-principal: #ff7600;
            --color-principal-hover: #e66a00;
            --color-texto: #1a1a1a;
            --color-texto-suave: #666666;
            --color-tarjeta: #ffffff;
            --color-whatsapp: #25d366;
            --sombra-suave: 0 12px 30px rgba(0, 0, 0, 0.04);
            --sombra-fuerte: 0 15px 40px rgba(255, 118, 0, 0.12);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            color: var(--color-texto); line-height: 1.6; margin: 0; overflow-x: hidden;
            background-color: #ffeedb;
            background-image: 
                radial-gradient(rgba(255, 118, 0, 0.05) 2px, transparent 2px),
                linear-gradient(135deg, #fdfbf7 0%, #ffeedb 100%);
            background-size: 24px 24px, 100% 100%;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        .contenedor-principal { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

        /* Cabecera Hero */
        .cabecera-catalogo {
            position: relative; margin: 0 -16px 24px -16px; text-align: center;
            padding: 3rem 1rem 2rem; background: linear-gradient(to bottom, #ff7600, #1a1a1a);
            background-size: cover; background-position: center;
            border-radius: 0 0 24px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden;
        }
        @media (min-width: 1100px) {
            .cabecera-catalogo { margin: 16px 0 32px 0; border-radius: 24px; padding: 4rem 1rem 3rem; }
        }
        
        .cabecera-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%); z-index: 1; }
        .cabecera-contenido { position: relative; z-index: 2; }
        
        .logo-container {
            width: 90px; height: 90px; margin: 0 auto 10px auto; position: relative; border-radius: 50%; overflow: hidden;
            background-color: #ff6b00; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 3px solid white;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; background-color: white; }
        
        .cabecera-catalogo h1 { font-size: 2.5rem; font-weight: 700; color: #ffffff; margin-bottom: 0.2rem; letter-spacing: -1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .cabecera-catalogo p { font-size: 1.1rem; margin-bottom: 1.5rem; color: #f0f0f0; font-weight: 300; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        .btn-whatsapp-header {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background-color: var(--color-whatsapp); color: white; padding: 12px 28px; border-radius: 50px; text-decoration: none; font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: all 0.3s ease; margin-bottom: 5px;
        }
        .btn-whatsapp-header:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.4); background: #1ebd5a; }
        .btn-whatsapp-header svg { width: 20px; height: 20px; fill: currentColor; }

        /* Filtros y Catálogo */
        .filtros { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 1rem 1rem 2rem; max-width: 1000px; margin: 0 auto; }
        .btn-filtro { background: white; border: 1px solid #e0e0e0; color: var(--color-texto-suave); padding: 10px 24px; border-radius: 30px; font-family: inherit; font-weight: 500; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); cursor: pointer; }
        .btn-filtro:hover { border-color: var(--color-principal); color: var(--color-principal); }
        .btn-filtro.activo { background: var(--color-principal); border-color: var(--color-principal); color: white; box-shadow: 0 6px 15px rgba(255, 118, 0, 0.2); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; padding: 0 0 4rem; }
        .tarjeta-producto { 
            background: var(--color-tarjeta); border-radius: 24px; overflow: hidden; box-shadow: var(--sombra-suave); 
            display: flex; flex-direction: column; position: relative; transition: all 0.4s ease; border: 1px solid rgba(0,0,0,0.01); cursor: pointer;
        }
        .tarjeta-producto:hover { transform: translateY(-10px); box-shadow: var(--sombra-fuerte); }
        .producto-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; transition: transform 0.5s ease; }
        .tarjeta-producto:hover .producto-img { transform: scale(1.05); }

        .etiqueta {
            position: absolute; top: 15px; left: 15px; background-color: #ff3b3b; color: white; padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; z-index: 2; box-shadow: 0 4px 10px rgba(255, 59, 59, 0.3);
        }

        .info-producto { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; background: white; position: relative; z-index: 2; }
        .info-producto h3 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--color-texto); font-weight: 700; }
        .info-producto p { font-size: 0.95rem; color: var(--color-texto-suave); margin-bottom: 1.5rem; flex-grow: 1; line-height: 1.7; }
        
        .caja-precio { display: flex; justify-content: space-between; align-items: center; margin-top: auto; min-height: 44px; }
        .precio { font-size: 1.6rem; font-weight: 700; color: var(--color-principal); }
        .contenedor-accion { display: flex; justify-content: flex-end; }
        
        /* Botones Acción (Pedir WhatsApp Directo) */
        .btn-whatsapp {
            min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: #f4f7f6; color: var(--color-texto); text-decoration: none; padding: 0 16px; border-radius: 12px; font-weight: 600; transition: all 0.3s ease;
        }
        .btn-whatsapp svg { width: 20px; height: 20px; fill: var(--color-whatsapp); transition: all 0.3s ease; }
        .tarjeta-producto:hover .btn-whatsapp { background: var(--color-whatsapp); color: white; }
        .tarjeta-producto:hover .btn-whatsapp svg { fill: white; }

        /* Botones Acción (Modo Carrito) */
        .btn-agregar {
            min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--color-whatsapp); color: white; padding: 0 16px; border-radius: 12px; font-weight: 600; font-family: inherit; font-size: 1rem; border: none; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-agregar:hover { background: #1ebd5a; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
        
        .control-cantidad { display: inline-flex; align-items: center; background: #f0f0f0; border-radius: 12px; height: 44px; overflow: hidden; }
        .control-cantidad button { background: none; border: none; width: 40px; height: 100%; font-size: 1.4rem; cursor: pointer; color: var(--color-texto); transition: background 0.2s; }
        .control-cantidad button:hover { background: #e0e0e0; }
        .control-cantidad span { width: 30px; text-align: center; font-weight: 700; font-size: 1.1rem; }

        /* Footer */
        footer { text-align: center; padding: 40px 0 20px 0; color: #444; }
        .footer-titulo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--color-texto); margin-bottom: 1.5rem; }
        .footer-dato { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; color: #555; font-size: 14px; }
        .footer-dato a { color: #555; text-decoration: none; transition: color 0.3s; font-weight: 500; }
        .footer-dato a:hover { color: var(--color-principal); }
        .footer-icono { width: 20px; height: 20px; fill: var(--color-principal); flex-shrink: 0; }
        .footer-demo { margin-top: 25px; font-size: 12px; color: #777; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); display: inline-block; }
        
        /* Botón WhatsApp Flotante */
        .flotante-wa { position: fixed; bottom: 25px; right: 25px; background: var(--color-whatsapp); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(37,211,102,0.4); text-decoration: none; z-index: 1000; transition: transform 0.3s ease; }
        .flotante-wa:hover { transform: scale(1.1) rotate(-5deg); }
        .flotante-wa svg { width: 36px; height: 36px; fill: white; }

        /* Barra Flotante Carrito */
        .barra-carrito {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--color-whatsapp); color: white;
            display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; cursor: pointer;
            z-index: 1500; font-weight: 700; font-size: 1.1rem; transform: translateY(100%); transition: transform 0.3s ease;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
        }
        .barra-carrito.visible { transform: translateY(0); }
        .barra-carrito:hover { background: #1ebd5a; }

        /* Modales Generales (Detalle y Panel de Carrito) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; padding: 16px;
        }
        .modal-overlay.activo { display: flex; opacity: 1; }
        .modal-cerrar {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background 0.3s;
        }
        .modal-cerrar:hover { background: black; }
        body.modal-abierto { overflow: hidden; }

        /* Modal Detalle Producto */
        .modal-contenido {
            background: white; border-radius: 20px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; position: relative;
            transform: translateY(20px); transition: transform 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-overlay.activo .modal-contenido { transform: translateY(0); }
        .modal-img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .modal-info { padding: 24px; }
        .modal-info h3 { font-size: 1.6rem; margin-bottom: 5px; color: var(--color-texto); line-height: 1.2; }
        .modal-precio { font-size: 1.6rem; font-weight: 700; color: var(--color-principal); margin-bottom: 12px; }
        .modal-desc { color: var(--color-texto-suave); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; }
        .modal-incluye { margin-bottom: 24px; background: #f8f9fa; padding: 16px; border-radius: 12px; }
        .modal-incluye h4 { margin-bottom: 10px; font-size: 1rem; color: var(--color-texto); }
        .modal-incluye ul { list-style: none; padding: 0; margin: 0; }
        .modal-incluye li { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.9rem; color: #555; }
        .modal-incluye li::before { content: "•"; color: var(--color-principal); font-weight: bold; margin-right: 8px; font-size: 1.2rem; line-height: 1; }
        
        #modal-caja-boton { display: block; width: 100%; }
        #modal-caja-boton .btn-agregar, #modal-caja-boton .btn-whatsapp { width: 100%; padding: 14px; font-size: 1.1rem; }
        #modal-caja-boton .control-cantidad { width: 100%; justify-content: center; }

        /* Panel Carrito */
        .panel-carrito {
            background: white; width: 100%; max-width: 450px; height: 100vh; position: absolute; right: 0; top: 0; border-radius: 0;
            display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; box-shadow: -5px 0 25px rgba(0,0,0,0.1);
        }
        @media (min-width: 600px) {
            .panel-carrito { height: 90vh; top: 5vh; right: auto; border-radius: 20px; }
            .modal-overlay.activo .panel-carrito { transform: translateY(0) !important; }
            .panel-carrito { transform: translateY(20px); }
        }
        .modal-overlay.activo .panel-carrito { transform: translateX(0); }
        
        .panel-header { padding: 20px; border-bottom: 1px solid #eaeaea; display: flex; justify-content: space-between; align-items: center; }
        .panel-header h3 { margin: 0; font-size: 1.4rem; color: var(--color-texto); }
        .lista-pedido { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .item-carrito { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed #eaeaea; }
        .item-info { flex-grow: 1; padding-right: 15px; }
        .item-nombre { font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
        .item-subtotal { color: var(--color-principal); font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; }
        .btn-eliminar { background: none; border: none; color: #ff3b3b; cursor: pointer; padding: 5px; opacity: 0.7; transition: opacity 0.3s; }
        .btn-eliminar:hover { opacity: 1; }
        
        .panel-footer { padding: 20px; border-top: 1px solid #eaeaea; background: #fafafa; }
        .resumen-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; color: var(--color-texto); }
        .btn-enviar-pedido {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            background: var(--color-whatsapp); color: white; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s; font-family: inherit;
        }
        .btn-enviar-pedido:hover { background: #1ebd5a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37,211,102,0.3); }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        
        <header class="cabecera-catalogo" id="header-hero">
            <div class="cabecera-overlay"></div>
            <div class="cabecera-contenido">
                <div class="logo-container">
                    <span id="logo-texto">TD</span>
                    <img src="fotos/logo.png" alt="Logo" id="logo-img" class="logo-img" onerror="this.style.display='none'">
                </div>
                <h1 id="header-nombre">Cargando...</h1>
                <p id="header-frase"></p>
                <div id="estado-tienda" style="margin-bottom: 15px;"></div>
                <a href="#" target="_blank" class="btn-whatsapp-header" id="wa-header">

        <footer id="pie-pagina"></footer>

    </div>

    <!-- Barra y Botón Flotante -->
    <div id="barra-carrito" class="barra-carrito">
        <span>Ver pedido (<span id="barra-qty">0</span>)</span>
        <span id="barra-total">S/ 0.00</span>
    </div>

        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>

    <!-- Modal Detalle -->
    <div id="producto-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1">
        <div class="modal-contenido" role="document">
            <button id="modal-btn-cerrar" class="modal-cerrar" aria-label="Cerrar detalle">✖</button>
            <img id="modal-img" src="" alt="" class="modal-img">
            <div class="modal-info">
                <h3 id="modal-titulo"></h3>
                <div id="modal-precio" class="modal-precio"></div>
                <p id="modal-desc" class="modal-desc"></p>
                <div id="modal-incluye-container" class="modal-incluye" style="display: none;">
                    <h4>Este plato incluye:</h4>
                    <ul id="modal-incluye-lista"></ul>
                </div>
                <!-- Contenedor dinámico del botón del modal -->
                <div id="modal-caja-boton"></div>
            </div>
        </div>
    </div>

    <!-- Modal Panel Carrito -->
    <div id="panel-carrito-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Tu pedido" tabindex="-1">
        <div class="panel-carrito" role="document">
            <div class="panel-header">
                <h3>Tu Pedido</h3>
                <button id="btn-cerrar-carrito" class="modal-cerrar" style="position:relative; top:0; right:0;" aria-label="Cerrar pedido">✖</button>
            </div>
            <div id="lista-pedido" class="lista-pedido"></div>
            <div class="panel-footer">
                <p id="nota-delivery" style="font-size: 13px; color: #666; margin-bottom: 12px;"></p>
                <div class="resumen-total">
                    <span>Total de platos:</span>
                    <span id="total-pedido">S/ 0.00</span>

        // --- SISTEMA DE CARRITO EN MEMORIA ---
        let carrito = {}; // { idProducto: cantidad }

        function generarBotonAccion(id, isModal = false) {

                            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg> Pedir

        function cambiarCantidad(id, delta) {
            if (!carrito[id]) carrito[id] = 0;
            carrito[id] += delta;
            if (carrito[id] <= 0) delete carrito[id];
            actualizarUI();
        }

        function actualizarUI() {
            // Actualizar botones en tarjetas
            document.querySelectorAll('.contenedor-accion').forEach(el => {
                const id = parseInt(el.getAttribute('data-id'));
                el.innerHTML = generarBotonAccion(id);
            });
            // Actualizar botón en modal de detalle
            const modalBtnCaja = document.getElementById('modal-caja-boton');
            if (modalBtnCaja.getAttribute('data-id')) {
                modalBtnCaja.innerHTML = generarBotonAccion(parseInt(modalBtnCaja.getAttribute('data-id')), true);
            }

            // Calcular totales
            let totalItems = 0;
            let totalPrecio = 0;
            for (let id in carrito) {
                const q = carrito[id];
                const p = productos.find(x => x.id === parseInt(id));
                if (p) { totalItems += q; totalPrecio += q * p.precio; }
            }

            // Actualizar Barra Flotante
            const barra = document.getElementById('barra-carrito');
            const flotante = document.getElementById('wa-flotante');
            if (totalItems > 0) {
                barra.classList.add('visible');
                document.getElementById('barra-qty').textContent = totalItems;
                document.getElementById('barra-total').textContent = `S/ ${totalPrecio.toFixed(2)}`;
                flotante.style.display = 'none'; 
            } else {
                barra.classList.remove('visible');
                flotante.style.display = 'flex';
                if (document.getElementById('panel-carrito-modal').classList.contains('activo')) cerrarPanelCarrito();
            }

            // Actualizar Panel si está abierto
            if (document.getElementById('panel-carrito-modal').classList.contains('activo')) renderizarListaCarrito();
        }

        function renderizarListaCarrito() {
            const lista = document.getElementById('lista-pedido');
            let total = 0;
            lista.innerHTML = Object.keys(carrito).map(id => {
                const q = carrito[id];
                const p = productos.find(x => x.id === parseInt(id));
                if(!p) return '';
                const sub = q * p.precio;
                total += sub;
                return `
                <div class="item-carrito">
                    <div class="item-info">
                        <div class="item-nombre">${p.nombre}</div>
                        <div class="item-subtotal">S/ ${sub.toFixed(2)}</div>
                        <div class="control-cantidad" style="height:36px;">
                            <button class="action-btn" data-act="minus" data-id="${p.id}" style="font-size:1.2rem;">−</button>
                            <span>${q}</span>
                            <button class="action-btn" data-act="plus" data-id="${p.id}" style="font-size:1.2rem;">+</button>
                        </div>
                    </div>
                    <button class="btn-eliminar action-btn" data-act="trash" data-id="${p.id}" aria-label="Quitar">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>`;
            }).join('');
            document.getElementById('total-pedido').textContent = `S/ ${total.toFixed(2)}`;
        }

        // Delegación de eventos global para botones de carrito
        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('.action-btn');

            const id = parseInt(btn.getAttribute('data-id'));
            
            if (btn.classList.contains('btn-agregar')) { cambiarCantidad(id, 1); } 
            else if (btn.getAttribute('data-act') === 'plus') { cambiarCantidad(id, 1); } 
            else if (btn.getAttribute('data-act') === 'minus') { cambiarCantidad(id, -1); } 
            else if (btn.getAttribute('data-act') === 'trash') { cambiarCantidad(id, -carrito[id]); }
        });

        // Enviar WhatsApp desde el panel de carrito
        document.getElementById('btn-enviar-pedido').addEventListener('click', () => {

            for(let id in carrito) {
                const q = carrito[id];
                const p = productos.find(x => x.id === parseInt(id));

                    const sub = q * p.precio;
                    msg += `- ${q} x ${p.nombre} — S/ ${sub.toFixed(2)}\n`;

            elementoFocoAnterior = document.activeElement;

            if (horarioHoy) {
                const [hA, mA] = horarioHoy.apertura.split(':').map(Number);

            return `<span style="background-color: #ff3b3b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">Cerrado ahora</span>`;

            if (NEGOCIO.mapsUrl) html += `<div class="footer-dato" style="margin-bottom: 20px;"><svg class="footer-icono" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> <a href="${NEGOCIO.mapsUrl}" target="_blank">Ver en Google Maps</a></div>`;
            
            if (NEGOCIO.infoDelivery) html += `<div class="footer-dato" style="color: var(--color-texto); font-weight: 500; margin-bottom: 5px;"><svg class="footer-icono" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg> ${NEGOCIO.infoDelivery}</div>`;
            if (NEGOCIO.mediosPago && NEGOCIO.mediosPago.length > 0) html += `<div class="footer-dato" style="margin-bottom: 20px;"><svg class="footer-icono" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg> Aceptamos: ${NEGOCIO.mediosPago.join(', ')}</div>`;
            
            let redesHtml = '';
            if (NEGOCIO.facebook) redesHtml += `<a href="${NEGOCIO.facebook}" target="_blank" style="display:flex; align-items:center;"><svg class="footer-icono" viewBox="0 0 24 24" style="margin-right:4px;"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>Facebook</a>`;
            if (NEGOCIO.instagram) redesHtml += `<a href="${NEGOCIO.instagram}" target="_blank" style="display:flex; align-items:center;"><svg class="footer-icono" viewBox="0 0 24 24" style="margin-right:4px;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a>`;
            if (redesHtml) html += `<div class="footer-dato" style="gap:20px; margin-bottom: 20px;">${redesHtml}</div>`;

            if (NEGOCIO.ruc || NEGOCIO.razonSocial) html += `<div class="footer-dato" style="font-size: 12px; opacity: 0.7;">${NEGOCIO.razonSocial || ''} ${NEGOCIO.ruc ? 'RUC: '+NEGOCIO.ruc : ''}</div>`;
            if (NEGOCIO.esDemo) html += `<div class="footer-demo">Catálogo de ejemplo</div>`;
            footer.innerHTML = html;
        }

        const contenedorProductos = document.getElementById('contenedor-productos');
        const categorias = ["Todos", ...new Set(productos.map(p => p.categoria))];

        function generarFiltros() {
            if (productos.length > 8) {
                document.getElementById('contenedor-filtros').innerHTML = categorias.map(cat => 
                    `<button class="btn-filtro ${cat === 'Todos' ? 'activo' : ''}" data-categoria="${cat}">${cat}</button>`
                ).join('');
                document.querySelectorAll('.btn-filtro').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
                        e.target.classList.add('activo');
                        const cat = e.target.getAttribute('data-categoria');
                        renderizarProductos(cat === "Todos" ? productos : productos.filter(p => p.categoria === cat));
                        actualizarUI(); // Sincroniza botones
                    });
                });
            }
        }

        function renderizarProductos(items) {
            contenedorProductos.innerHTML = items.map(prod => {
                const insignia = prod.etiqueta ? `<div class="etiqueta">${prod.etiqueta}</div>` : '';
                return `
                <div class="tarjeta-producto" data-id="${prod.id}">
                    <div style="position: relative; overflow: hidden;">
                        ${insignia}
                        <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy" class="producto-img" onerror="this.src='https://placehold.co/640x480/e0e0e0/ffffff?text=Falta+Foto'">
                    </div>
                    <div class="info-producto">
                        <h3>${prod.nombre}</h3>
                        <p>${prod.descripcion}</p>
                        <div class="caja-precio">
                            <div class="precio">S/ ${prod.precio.toFixed(2)}</div>
                            <div class="contenedor-accion" data-id="${prod.id}">
                                ${generarBotonAccion(prod.id)}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        inicializarNegocio();
        renderizarFooter();
        generarFiltros();
        renderizarProductos(productos);
        actualizarUI(); // Forzar sincronización inicial del carrito
    </script>
</body>
</html>
