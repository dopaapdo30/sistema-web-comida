    <style>
        :root {
            --color-principal: #ff7600;
            --color-principal-hover: #e66a00;
            --color-texto: #1a1a1a;
            --color-texto-suave: #666666;
            --color-tarjeta: #ffffff;
            --color-whatsapp: #25d366;
            --sombra-suave: 0 12px 30px rgba(0, 0, 0, 0.04);
            --sombra-fuerte: 0 15px 40px rgba(255, 118, 0, 0.12);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            color: var(--color-texto); line-height: 1.6; margin: 0; overflow-x: hidden;
            background-color: #ffeedb;
            background-image: 
                radial-gradient(rgba(255, 118, 0, 0.05) 2px, transparent 2px),
                linear-gradient(135deg, #fdfbf7 0%, #ffeedb 100%);
            background-size: 24px 24px, 100% 100%;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        .contenedor-principal {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .cabecera-catalogo {
            position: relative;
            margin: 0 -16px 24px -16px;
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: linear-gradient(to bottom, #ff7600, #1a1a1a);
            background-size: cover;
            background-position: center;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        @media (min-width: 1100px) {
            .cabecera-catalogo { margin: 16px 0 32px 0; border-radius: 24px; padding: 4rem 1rem 3rem; }
        }
        
        .cabecera-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }
        .cabecera-contenido { position: relative; z-index: 2; }
        
        .logo-container {
            width: 90px; height: 90px; margin: 0 auto 10px auto;
            position: relative; border-radius: 50%; overflow: hidden;
            background-color: #ff6b00; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 32px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 3px solid white;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; background-color: white; }
        
        .cabecera-catalogo h1 { font-size: 2.5rem; font-weight: 700; color: #ffffff; margin-bottom: 0.2rem; letter-spacing: -1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .cabecera-catalogo p { font-size: 1.1rem; margin-bottom: 1.5rem; color: #f0f0f0; font-weight: 300; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        .btn-whatsapp-header {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background-color: var(--color-whatsapp); color: white;
            padding: 12px 28px; border-radius: 50px; text-decoration: none; font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); transition: all 0.3s ease; margin-bottom: 5px;
        }
        .btn-whatsapp-header:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.4); background: #1ebd5a; }
        .btn-whatsapp-header svg { width: 20px; height: 20px; fill: currentColor; }

        .filtros { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 1rem 1rem 2rem; max-width: 1000px; margin: 0 auto; }
        .btn-filtro { background: white; border: 1px solid #e0e0e0; color: var(--color-texto-suave); padding: 10px 24px; border-radius: 30px; font-family: 'Poppins', sans-serif; font-weight: 500; transition: all 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); cursor: pointer; }
        .btn-filtro:hover { border-color: var(--color-principal); color: var(--color-principal); }
        .btn-filtro.activo { background: var(--color-principal); border-color: var(--color-principal); color: white; box-shadow: 0 6px 15px rgba(255, 118, 0, 0.2); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; padding: 0 0 4rem; }
        .tarjeta-producto { 
            background: var(--color-tarjeta); 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: var(--sombra-suave); 
            display: flex; flex-direction: column; 
            position: relative;
            transition: all 0.4s ease;
            border: 1px solid rgba(0,0,0,0.01);
            cursor: pointer;
        }
        .tarjeta-producto:hover { transform: translateY(-10px); box-shadow: var(--sombra-fuerte); }
        
        .producto-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .tarjeta-producto:hover .producto-img { transform: scale(1.05); }

        .etiqueta {
            position: absolute; top: 15px; left: 15px;
            background-color: #ff3b3b; color: white;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; z-index: 2;
            box-shadow: 0 4px 10px rgba(255, 59, 59, 0.3);
        }

        .info-producto { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; background: white; position: relative; z-index: 2; }
        .info-producto h3 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--color-texto); font-weight: 700; }
        .info-producto p { font-size: 0.95rem; color: var(--color-texto-suave); margin-bottom: 1.5rem; flex-grow: 1; line-height: 1.7; }
        
        .caja-precio { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .precio { font-size: 1.6rem; font-weight: 700; color: var(--color-principal); }
        
        .btn-whatsapp {
            min-height: 44px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: #f4f7f6; color: var(--color-texto);
            text-decoration: none; padding: 0 16px; border-radius: 12px; font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-whatsapp svg { width: 20px; height: 20px; fill: var(--color-whatsapp); transition: all 0.3s ease; }
        .tarjeta-producto:hover .btn-whatsapp { background: var(--color-whatsapp); color: white; }
        .tarjeta-producto:hover .btn-whatsapp svg { fill: white; }

        footer { text-align: center; padding: 40px 0 20px 0; color: #444; }
        .footer-titulo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--color-texto); margin-bottom: 1.5rem; }
        .footer-dato { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; color: #555; font-size: 14px; }
        .footer-dato a { color: #555; text-decoration: none; transition: color 0.3s; font-weight: 500; }
        .footer-dato a:hover { color: var(--color-principal); }
        .footer-icono { width: 20px; height: 20px; stroke: var(--color-principal); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .footer-demo { margin-top: 25px; font-size: 12px; color: #777; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.1); display: inline-block; }
        
        .flotante-wa { position: fixed; bottom: 25px; right: 25px; background: var(--color-whatsapp); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(37,211,102,0.4); text-decoration: none; z-index: 1000; transition: transform 0.3s ease; }
        .flotante-wa:hover { transform: scale(1.1) rotate(-5deg); }
        .flotante-wa svg { width: 36px; height: 36px; fill: white; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease; padding: 16px;
        }
        .modal-overlay.activo { display: flex; opacity: 1; }
        .modal-contenido {
            background: white; border-radius: 20px; width: 100%; max-width: 450px;
            max-height: 90vh; overflow-y: auto; position: relative;
            transform: translateY(20px); transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .modal-overlay.activo .modal-contenido { transform: translateY(0); }
        .modal-cerrar {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0,0,0,0.6); color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 10; transition: background 0.3s;
        }
        .modal-cerrar:hover { background: black; }
        .modal-img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .modal-info { padding: 24px; }
        .modal-info h3 { font-size: 1.6rem; margin-bottom: 5px; color: var(--color-texto); line-height: 1.2; }
        .modal-precio { font-size: 1.6rem; font-weight: 700; color: var(--color-principal); margin-bottom: 12px; }
        .modal-desc { color: var(--color-texto-suave); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; }
        .modal-incluye { margin-bottom: 24px; background: #f8f9fa; padding: 16px; border-radius: 12px; }
        .modal-incluye h4 { margin-bottom: 10px; font-size: 1rem; color: var(--color-texto); }
        .modal-incluye ul { list-style: none; padding: 0; margin: 0; }
        .modal-incluye li { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.9rem; color: #555; }
        .modal-incluye li::before { content: "•"; color: var(--color-principal); font-weight: bold; margin-right: 8px; font-size: 1.2rem; line-height: 1; }
        .btn-whatsapp-modal {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--color-whatsapp); color: white; width: 100%;
            padding: 14px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1.1rem;
            transition: all 0.3s;

        body.modal-abierto { overflow: hidden; }

            { id: 7, categoria: "Bebidas", nombre: "Jarra de Chicha Morada", descripcion: "Chicha natural helada hervida con maíz morado.", precio: 12.00, imagen: "fotos/chicha_morada.jpg", incluye: ["Jarra de 1 Litro", "Hervida con canela y clavo de olor", "Toque de limón fresco"] },
            { id: 8, categoria: "Bebidas", nombre: "Limonada Frozen", descripcion: "Limonada súper refrescante batida con hielo.", precio: 10.00, imagen: "fotos/limonada.jpg", incluye: ["Vaso grande personal", "Hielo triturado tipo frozen", "Rodajas y jugo de limones frescos"] },
            { id: 9, categoria: "Postres", nombre: "Crema Volteada", descripcion: "Porción de crema volteada casera bañada en caramelo.", precio: 8.00, imagen: "fotos/postre.jpg" }
        ];

        // 1. Funciones de Inicialización
        function verificarEstadoTienda() {
            if (!NEGOCIO.horarioSemanal) return `<span style="font-size:14px; color:#f0f0f0; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">${NEGOCIO.horarioTexto}</span>`;
            
            // Forzar hora actual a zona horaria de Lima
            const fechaLima = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Lima"}));
            const dia = fechaLima.getDay();
            const horaActual = fechaLima.getHours() * 60 + fechaLima.getMinutes();
            const horarioHoy = NEGOCIO.horarioSemanal[dia];
            
            if (horarioHoy) {
                const [hA, mA] = horarioHoy.apertura.split(':').map(Number);
                const [hC, mC] = horarioHoy.cierre.split(':').map(Number);
                const minApertura = hA * 60 + mA;
                const minCierre = hC * 60 + mC;

                if (horaActual >= minApertura && horaActual <= minCierre) {
                    return `<span style="background-color: #25d366; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">Abierto ahora</span>`;
                }
            }
            return `<span style="background-color: #ff3b3b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">Cerrado ahora</span>`;
        }

        function inicializarNegocio() {
            // Actualizar SEO Dinámico
            document.title = `${NEGOCIO.nombre} | Catálogo`;
            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute("content", `${NEGOCIO.nombre} | Catálogo`);
            const ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute("content", NEGOCIO.frase);
            const ogImage = document.querySelector('meta[property="og:image"]');
            if (ogImage) ogImage.setAttribute("content", `https://topdopa-demo.pages.dev/${NEGOCIO.portada}`);

            document.getElementById('header-nombre').textContent = NEGOCIO.nombre;
            document.getElementById('header-frase').textContent = NEGOCIO.frase;
            document.getElementById('logo-img').alt = NEGOCIO.nombre;
            
            const estadoTienda = document.getElementById('estado-tienda');
            if (estadoTienda) estadoTienda.innerHTML = verificarEstadoTienda();

            const headerHero = document.getElementById('header-hero');
            if(NEGOCIO.portada) {
                headerHero.style.backgroundImage = `url('${NEGOCIO.portada}')`;
            }
            
            const palabras = NEGOCIO.nombre.split(' ');
            const iniciales = (palabras.length > 1 ? palabras[0][0] + palabras[1][0] : NEGOCIO.nombre.substring(0,2)).toUpperCase();
            document.getElementById('logo-texto').textContent = iniciales;
            
            const linkWaBase = `https://wa.me/${NEGOCIO.whatsapp}`;
            document.getElementById('wa-header').href = linkWaBase;
            document.getElementById('wa-flotante').href = linkWaBase;
        }

        // 2. Construir Pie de Página dinámico
        function renderizarFooter() {
            const footer = document.getElementById('pie-pagina');
            let html = `<h2 class="footer-titulo">Visítanos</h2>`;
            
            if (NEGOCIO.horarioTexto) html += `<div class="footer-dato"><svg class="footer-icono" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${NEGOCIO.horarioTexto}</div>`;
            if (NEGOCIO.direccion) html += `<div class="footer-dato"><svg class="footer-icono" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg> ${NEGOCIO.direccion}</div>`;
            if (NEGOCIO.mapsUrl) html += `<div class="footer-dato" style="margin-bottom: 20px;"><svg class="footer-icono" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg> <a href="${NEGOCIO.mapsUrl}" target="_blank">Ver en Google Maps</a></div>`;
            
            if (NEGOCIO.infoDelivery) html += `<div class="footer-dato" style="color: var(--color-texto); font-weight: 500; margin-bottom: 5px;">🛵 ${NEGOCIO.infoDelivery}</div>`;
            if (NEGOCIO.mediosPago && NEGOCIO.mediosPago.length > 0) html += `<div class="footer-dato" style="margin-bottom: 20px;">💳 Aceptamos: ${NEGOCIO.mediosPago.join(', ')}</div>`;
            
            let redesHtml = '';
            if (NEGOCIO.facebook) {
                redesHtml += `<a href="${NEGOCIO.facebook}" target="_blank" style="display:flex; align-items:center;"><svg class="footer-icono" viewBox="0 0 24 24" style="margin-right:4px;"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>Facebook</a>`;
            }
            if (NEGOCIO.instagram) {
                redesHtml += `<a href="${NEGOCIO.instagram}" target="_blank" style="display:flex; align-items:center;"><svg class="footer-icono" viewBox="0 0 24 24" style="margin-right:4px;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a>`;
            }
            if (redesHtml) {
                html += `<div class="footer-dato" style="gap:20px; margin-bottom: 20px;">${redesHtml}</div>`;
            }

            if (NEGOCIO.ruc || NEGOCIO.razonSocial) {
                html += `<div class="footer-dato" style="font-size: 12px; opacity: 0.7;">${NEGOCIO.razonSocial || ''} ${NEGOCIO.ruc ? 'RUC: '+NEGOCIO.ruc : ''}</div>`;
            }

            if (NEGOCIO.esDemo) {
                html += `<div class="footer-demo">Catálogo de ejemplo</div>`;
            }

            footer.innerHTML = html;
        }

        // 3. Renderizar Filtros
        const contenedorProductos = document.getElementById('contenedor-productos');
        const contenedorFiltros = document.getElementById('contenedor-filtros');
        const categorias = ["Todos", ...new Set(productos.map(p => p.categoria))];

        function generarFiltros() {
            if (productos.length > 8) {
                contenedorFiltros.innerHTML = categorias.map(cat => 
                    `<button class="btn-filtro ${cat === 'Todos' ? 'activo' : ''}" data-categoria="${cat}">${cat}</button>`
                ).join('');

                // Asignar eventos de clic
                document.querySelectorAll('.btn-filtro').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
                        e.target.classList.add('activo');
                        
                        const cat = e.target.getAttribute('data-categoria');
                        const filtrados = cat === "Todos" ? productos : productos.filter(p => p.categoria === cat);
                        renderizarProductos(filtrados);
                    });
                });
            }
        }

        // 4. Renderizar Productos
        function renderizarProductos(items) {
            contenedorProductos.innerHTML = items.map(prod => {
                const insignia = prod.etiqueta ? `<div class="etiqueta">${prod.etiqueta}</div>` : '';
                const textoWa = encodeURIComponent(`Hola ${NEGOCIO.nombre}, quisiera pedir: *${prod.nombre}*`);
                const linkWa = `https://wa.me/${NEGOCIO.whatsapp}?text=${textoWa}`;
                
                return `
                <div class="tarjeta-producto" data-id="${prod.id}">
                    <div style="position: relative; overflow: hidden;">
                        ${insignia}
                        <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy" class="producto-img" onerror="this.src='https://placehold.co/640x480/e0e0e0/ffffff?text=Falta+Foto'">
                    </div>
                    <div class="info-producto">
                        <h3>${prod.nombre}</h3>
                        <p>${prod.descripcion}</p>
                        <div class="caja-precio">
                            <div class="precio">S/ ${prod.precio.toFixed(2)}</div>
                            <a href="${linkWa}" target="_blank" class="btn-whatsapp" aria-label="Pedir ${prod.nombre}" onclick="event.stopPropagation()">
                                <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                                Pedir
                            </a>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // 5. Lógica del Modal (Ventana Emergente)
        const modal = document.getElementById('producto-modal');
        let elementoFocoAnterior = null;

        contenedorProductos.addEventListener('click', (e) => {
            const tarjeta = e.target.closest('.tarjeta-producto');
            if (tarjeta) {
                const id = parseInt(tarjeta.getAttribute('data-id'));
                abrirModal(id);
            }
        });

        function abrirModal(id) {
            const prod = productos.find(p => p.id === id);
            if (!prod) return;

            elementoFocoAnterior = document.activeElement; 

            document.getElementById('modal-img').src = prod.imagen;
            document.getElementById('modal-img').alt = prod.nombre;
            document.getElementById('modal-titulo').textContent = prod.nombre;
            document.getElementById('modal-precio').textContent = `S/ ${prod.precio.toFixed(2)}`;
            document.getElementById('modal-desc').textContent = prod.detalle || prod.descripcion;

            const incluyeContenedor = document.getElementById('modal-incluye-container');
            const incluyeLista = document.getElementById('modal-incluye-lista');
            
            if (prod.incluye && prod.incluye.length > 0) {
                incluyeContenedor.style.display = 'block';
                incluyeLista.innerHTML = prod.incluye.map(item => `<li>${item}</li>`).join('');
            } else {
                incluyeContenedor.style.display = 'none';
            }

            const textoWa = encodeURIComponent(`Hola ${NEGOCIO.nombre}, quisiera pedir: *${prod.nombre}*`);
            document.getElementById('modal-wa').href = `https://wa.me/${NEGOCIO.whatsapp}?text=${textoWa}`;

            modal.classList.add('activo');
            document.body.classList.add('modal-abierto');
            modal.focus();
        }

        function cerrarModal() {
            modal.classList.remove('activo');
            document.body.classList.remove('modal-abierto');
            if (elementoFocoAnterior) elementoFocoAnterior.focus();
        }

        document.getElementById('modal-btn-cerrar').addEventListener('click', cerrarModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) cerrarModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('activo')) cerrarModal();
        });

        // 6. Iniciar la aplicación
        inicializarNegocio();
        renderizarFooter();
        generarFiltros();
        renderizarProductos(productos);
    </script>
</body>
</html>
