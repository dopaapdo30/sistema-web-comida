<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Dopa | Catálogo Premium</title>
    <meta name="description" content="Puro ceviche, causa y sabor criollo">

    <meta property="og:title" content="Top Dopa | Catálogo Premium">
    <meta property="og:description" content="Puro ceviche, causa y sabor criollo">
    <meta property="og:image" content="https://topdopa-demo.pages.dev/fotos/portada1.jpg">
    <meta property="og:url" content="https://topdopa-demo.pages.dev">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --oceano: #0B6E75;
            --coral: #E5532D;
            --arena: #FFF7EC;
            --tinta: #12313A;
            --whatsapp-envio: #128C7E;
            --color-texto-suave: #5B6B70;
            --sombra-suave: 0 12px 30px rgba(0, 0, 0, 0.04);
            --sombra-fuerte: 0 15px 40px rgba(11, 110, 117, 0.12);
            --borde-tarjeta: rgba(0,0,0,0.02);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { scroll-behavior: smooth; }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

        body { 
            font-family: 'Poppins', sans-serif; color: var(--tinta); line-height: 1.6; margin: 0; overflow-x: hidden;
            background-color: var(--arena);
            background-image: 
                radial-gradient(rgba(11, 110, 117, 0.05) 2px, transparent 2px),
                linear-gradient(135deg, #fffcf7 0%, var(--arena) 100%);
            background-size: 24px 24px, 100% 100%;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        /* Portada Welcome Hero */
        .portada-hero {
            position: relative; width: 100%; min-height: 100vh; min-height: 100svh;
            background: linear-gradient(to bottom, #064044, #021a1b);
            background-size: cover; background-position: center 40%;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 2rem 1rem;
            border-radius: 0 0 32px 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden;
        }
        @media (min-width: 1100px) { .portada-hero { min-height: 70vh; margin: 16px; border-radius: 24px; } }
        
        .portada-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%); z-index: 1; }
        
        .portada-tarjeta {
            position: relative; z-index: 2; width: 100%; max-width: 450px; text-align: center;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 28px; padding: 3rem 2rem 2rem; margin-bottom: 2rem;
        }
        @supports not (backdrop-filter: blur(12px)) { .portada-tarjeta { background: rgba(0, 0, 0, 0.6); } }

        .logo-container {
            width: 90px; height: 90px; position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            border-radius: 50%; overflow: hidden; background-color: var(--coral);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); border: 3px solid white; z-index: 3;
        }
        .logo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; background-color: white; }
        
        .bienvenido-texto { font-size: 0.9rem; font-weight: 500; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }
        .portada-tarjeta h1 { font-size: 2.8rem; font-weight: 700; color: #ffffff; margin-bottom: 0.2rem; letter-spacing: -1px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .portada-tarjeta p { font-size: 1.1rem; margin-bottom: 1.5rem; color: rgba(255,255,255,0.9); font-weight: 300; }
        
        #estado-tienda-portada { margin-bottom: 20px; }

        .btn-ver-carta {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background-color: var(--oceano); color: white; padding: 14px 32px; border-radius: 50px; font-weight: 600; font-size: 1.1rem; text-decoration: none;
            box-shadow: 0 8px 20px rgba(11, 110, 117, 0.4); transition: all 0.3s ease; border: none; cursor: pointer;
        }
        .btn-ver-carta:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(11, 110, 117, 0.5); background: #0e858e; }
        
        .flecha-scroll { position: relative; z-index: 2; margin-bottom: 1rem; animation: bounce 2s infinite; opacity: 0.8; color: white; display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; letter-spacing: 1px; }
        .flecha-scroll svg { width: 24px; height: 24px; margin-top: 5px; fill: white; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-5px); } }
        @media (prefers-reduced-motion: reduce) { .flecha-scroll { animation: none; } }

        /* Contenedor principal del catálogo */
        .contenedor-catalogo { max-width: 1100px; margin: 0 auto; padding: 0 16px; position: relative; top: -20px; }
        #seccion-catalogo { scroll-margin-top: 80px; }

        /* Filtros Sticky y Deslizables */
        .contenedor-filtros-sticky { position: sticky; top: 0; z-index: 100; background: linear-gradient(to bottom, var(--arena) 85%, transparent 100%); padding: 20px 0 30px; margin: 0 -16px; }
        .filtros { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; -ms-overflow-style: none; white-space: nowrap; }
        .filtros::-webkit-scrollbar { display: none; }
        .btn-filtro { background: white; border: 1px solid rgba(0,0,0,0.1); color: var(--tinta); padding: 10px 24px; border-radius: 30px; font-family: inherit; font-weight: 500; font-size: 0.95rem; transition: all 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; flex-shrink: 0; }
        .btn-filtro:hover { border-color: var(--oceano); color: var(--oceano); }
        .btn-filtro.activo { background: var(--oceano); border-color: var(--oceano); color: white; box-shadow: 0 4px 12px rgba(11, 110, 117, 0.3); }

        /* Catálogo y Tarjetas */
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; padding: 1rem 0 6rem; touch-action: pan-y; }
        .tarjeta-producto { background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: var(--sombra-suave); display: flex; flex-direction: column; position: relative; transition: all 0.4s ease; border: 1px solid var(--borde-tarjeta); cursor: pointer; }
        .tarjeta-producto:hover { transform: translateY(-10px); box-shadow: var(--sombra-fuerte); }
        .producto-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; transition: transform 0.5s ease; }
        .tarjeta-producto:hover .producto-img { transform: scale(1.05); }

        .etiqueta { position: absolute; top: 15px; left: 15px; background-color: var(--coral); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; z-index: 2; box-shadow: 0 4px 10px rgba(229, 83, 45, 0.3); }
        .info-producto { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; background: white; position: relative; z-index: 2; }
        .info-producto h3 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--tinta); font-weight: 700; line-height: 1.2; }
        .info-producto p { font-size: 0.95rem; color: var(--color-texto-suave); margin-bottom: 1.5rem; flex-grow: 1; line-height: 1.7; }
        .caja-precio { display: flex; justify-content: space-between; align-items: center; margin-top: auto; min-height: 44px; }
        .precio { font-size: 1.6rem; font-weight: 700; color: var(--coral); }
        .contenedor-accion { display: flex; justify-content: flex-end; }
        
        /* Botones Acción (Pedir/Agregar) */
        .btn-whatsapp { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--oceano); color: white; text-decoration: none; padding: 0 16px; border-radius: 12px; font-weight: 600; transition: all 0.3s ease; border: none; font-family: inherit; font-size: 1rem; cursor: pointer; }
        .btn-whatsapp svg { width: 20px; height: 20px; fill: white; transition: all 0.3s ease; }
        .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(11, 110, 117, 0.3); background: #0e858e; }
        
        .control-cantidad { display: inline-flex; align-items: center; background: #f0f0f0; border-radius: 12px; height: 44px; overflow: hidden; }
        .control-cantidad button { background: none; border: none; width: 40px; height: 100%; font-size: 1.4rem; cursor: pointer; color: var(--tinta); transition: background 0.2s; }
        .control-cantidad button:hover { background: #e0e0e0; }
        .control-cantidad span { width: 30px; text-align: center; font-weight: 700; font-size: 1.1rem; }

        /* Barra Flotante Carrito */
        .barra-carrito { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--oceano); color: white; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; cursor: pointer; z-index: 1500; font-weight: 700; font-size: 1.1rem; transform: translateY(100%); transition: transform 0.3s ease; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); }
        .barra-carrito.visible { transform: translateY(0); }
        .barra-carrito:hover { background: #0e858e; }

        /* Modales */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: rgba(0,0,0,0.6); z-index: 2000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; padding: 16px; }
        .modal-overlay.activo { display: flex; opacity: 1; }
        .modal-cerrar { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background 0.3s; }
        .modal-cerrar:hover { background: black; }
        body.modal-abierto { overflow: hidden; }

        /* Modal Detalle Producto */
        .modal-contenido { background: white; border-radius: 20px; width: 100%; max-width: 450px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; position: relative; transform: translateY(20px); transition: transform 0.3s ease; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-overlay.activo .modal-contenido { transform: translateY(0); }
        .modal-img { width: 100%; height: 280px; object-fit: cover; display: block; }
        .modal-info { padding: 24px; }
        .modal-info h3 { font-size: 1.6rem; margin-bottom: 5px; color: var(--tinta); line-height: 1.2; }
        .modal-precio { font-size: 1.6rem; font-weight: 700; color: var(--coral); margin-bottom: 12px; }
        .modal-desc { color: var(--color-texto-suave); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; }
        .modal-incluye { margin-bottom: 24px; background: var(--arena); padding: 16px; border-radius: 12px; border: 1px solid rgba(11, 110, 117, 0.1); }
        .modal-incluye h4 { margin-bottom: 10px; font-size: 1rem; color: var(--tinta); }
        .modal-incluye ul { list-style: none; padding: 0; margin: 0; }
        .modal-incluye li { display: flex; align-items: flex-start; margin-bottom: 8px; font-size: 0.9rem; color: #444; }
        .modal-incluye li::before { content: "•"; color: var(--oceano); font-weight: bold; margin-right: 8px; font-size: 1.2rem; line-height: 1; }
        #modal-caja-boton { display: block; width: 100%; }
        #modal-caja-boton .btn-whatsapp { width: 100%; padding: 14px; font-size: 1.1rem; }
        #modal-caja-boton .control-cantidad { width: 100%; justify-content: center; }

        /* Panel Carrito */
        .panel-carrito { background: white; width: 100%; max-width: 450px; height: 100vh; height: 100dvh; position: absolute; right: 0; top: 0; border-radius: 0; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; box-shadow: -5px 0 25px rgba(0,0,0,0.1); }
        @media (min-width: 600px) { .panel-carrito { height: 90vh; height: 90dvh; top: 5vh; right: auto; border-radius: 20px; } .modal-overlay.activo .panel-carrito { transform: translateY(0) !important; } .panel-carrito { transform: translateY(20px); } }
        .modal-overlay.activo .panel-carrito { transform: translateX(0); }
        .panel-header { padding: 20px; border-bottom: 1px solid #eaeaea; display: flex; justify-content: space-between; align-items: center; }
        .panel-header h3 { margin: 0; font-size: 1.4rem; color: var(--tinta); }
        .btn-vaciar { background: none; border: none; color: #ff3b3b; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-decoration: underline; margin-right: 40px; padding: 5px; }
        .lista-pedido { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .item-carrito { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed #eaeaea; }
        .item-info { flex-grow: 1; padding-right: 15px; }
        .item-nombre { font-weight: 600; margin-bottom: 4px; line-height: 1.3; color: var(--tinta); }
        .item-subtotal { color: var(--coral); font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; }
        .btn-eliminar { background: none; border: none; color: #ff3b3b; cursor: pointer; padding: 5px; opacity: 0.7; transition: opacity 0.3s; }
        .btn-eliminar:hover { opacity: 1; }
        .panel-footer { padding: 20px; border-top: 1px solid #eaeaea; background: #fafafa; }
        .resumen-total { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; color: var(--tinta); }
        
        .btn-enviar-pedido { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--whatsapp-envio); color: white; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s; font-family: inherit; }
        .btn-enviar-pedido:hover { background: #0f776a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(18,140,126,0.3); }

        /* Footer */
        footer { text-align: center; padding: 60px 20px 40px; color: #555; position: relative; z-index: 10; }
        .footer-titulo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--tinta); margin-bottom: 1.5rem; }
        .footer-dato { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
        .footer-dato a { color: #555; text-decoration: none; transition: color 0.3s; font-weight: 500; }
        .footer-dato a:hover { color: var(--oceano); }
        .footer-icono { width: 20px; height: 20px; fill: var(--oceano); flex-shrink: 0; }
        .footer-enlace-ayuda { margin-top: 10px; display: inline-block; font-weight: 600; color: var(--oceano); text-decoration: underline; padding: 10px; cursor: pointer;}
        .footer-enlace-ayuda:hover { color: var(--tinta); }
        .footer-demo { margin-top: 25px; font-size: 12px; color: #888; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.05); display: inline-block; }
        
        /* Avisos de Seguridad y Horario */
        .aviso-cerrado { background-color: #ffefef; color: #cc0000; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 12px; display: none; text-align: center; border: 1px solid #ffcccc; }
        .aviso-seguridad { font-size: 11px; color: var(--color-texto-suave); text-align: center; margin-bottom: 12px; line-height: 1.4; padding: 0 10px; }
    </style>
</head>
<body>

    <header class="portada-hero" id="header-hero">
        <div class="portada-overlay"></div>
        <div class="portada-tarjeta">
            <div class="logo-container">
                <span id="logo-texto">TD</span>
                <img src="fotos/logo.png" alt="Logo" id="logo-img" class="logo-img" onerror="this.style.display='none'">
            </div>
            <div class="bienvenido-texto">Bienvenido a</div>

        <div class="flecha-scroll">

        </div>
    </header>

    <div class="contenedor-catalogo" id="seccion-catalogo">
        <div class="contenedor-filtros-sticky">
            <div class="filtros" id="contenedor-filtros"></div>
        </div>
        <main class="catalogo" id="contenedor-productos"></main>
        <footer id="pie-pagina"></footer>
    </div>

    <!-- Barra Flotante Carrito -->
    <div id="barra-carrito" class="barra-carrito" aria-label="Ver pedido">
        <span>Ver pedido (<span id="barra-qty">0</span>)</span>
        <span id="barra-total">S/ 0.00</span>
    </div>

    <!-- Modal Detalle -->

    </div>

    <!-- Modal Panel Carrito -->
    <div id="panel-carrito-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Tu pedido" tabindex="-1">
        <div class="panel-carrito" role="document">

                    Enviar pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN CENTRAL DEL NEGOCIO
        const NEGOCIO = {
            nombre: "Top Dopa",
            lema: "Puro ceviche, causa y sabor criollo",
            whatsapp: "51927990393",
            horarioTexto: "Lunes a Sábado de 12:00 pm a 10:00 pm",
            horarioSemanal: {

                3: { apertura: "12:00", cierre: "22:00" }, 4: { apertura: "12:00", cierre: "22:00" },
                5: { apertura: "12:00", cierre: "22:00" }, 6: { apertura: "12:00", cierre: "22:00" },

            },
            direccion: "Tu calle y distrito, Lima",
            mapsUrl: "", 
            facebook: "",   
            instagram: "", 
            mediosPago: ["Yape", "Plin", "Efectivo", "Transferencias"],

            elementoFocoAnterior = document.activeElement; modalEl.classList.add('activo'); document.body.classList.add('modal-abierto'); modalEl.focus();
        }
        function cerrarModalGeneral(modalEl) {
            modalEl.classList.remove('activo'); document.body.classList.remove('modal-abierto'); if (elementoFocoAnterior) elementoFocoAnterior.focus();
        }

        document.getElementById('contenedor-productos').addEventListener('click', (e) => {
            const tarjeta = e.target.closest('.tarjeta-producto');
            if (tarjeta && !e.target.closest('.action-btn') && !e.target.closest('.btn-whatsapp')) {
                const id = parseInt(tarjeta.getAttribute('data-id')); const prod = productos.find(p => p.id === id);
                if (!prod) return;
                document.getElementById('modal-img').src = prod.imagen; document.getElementById('modal-img').alt = prod.nombre; document.getElementById('modal-titulo').textContent = prod.nombre; document.getElementById('modal-precio').textContent = `S/ ${prod.precio.toFixed(2)}`; document.getElementById('modal-desc').textContent = prod.detalle || prod.descripcion;
                const incluyeContenedor = document.getElementById('modal-incluye-container');
                if (prod.incluye && prod.incluye.length > 0) { incluyeContenedor.style.display = 'block'; document.getElementById('modal-incluye-lista').innerHTML = prod.incluye.map(item => `<li>${item}</li>`).join(''); } else { incluyeContenedor.style.display = 'none'; }
                const modalBtnCaja = document.getElementById('modal-caja-boton');
                modalBtnCaja.setAttribute('data-id', prod.id); modalBtnCaja.innerHTML = generarBotonAccion(prod.id);
                abrirModalGeneral(modalDetalle);
            }
        });
        
        document.getElementById('modal-btn-cerrar').addEventListener('click', () => cerrarModalGeneral(modalDetalle));
        modalDetalle.addEventListener('click', (e) => { if (e.target === modalDetalle) cerrarModalGeneral(modalDetalle); });

        document.getElementById('barra-carrito').addEventListener('click', () => { renderizarListaCarrito(); abrirModalGeneral(modalCarrito); });
        document.getElementById('btn-cerrar-carrito').addEventListener('click', () => cerrarModalGeneral(modalCarrito));
        modalCarrito.addEventListener('click', (e) => { if (e.target === modalCarrito) cerrarModalGeneral(modalCarrito); });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modalDetalle.classList.contains('activo')) cerrarModalGeneral(modalDetalle);
                if (modalCarrito.classList.contains('activo')) cerrarModalGeneral(modalCarrito);
            }
        });

        // --- LÓGICA DE DESLIZAMIENTO TÁCTIL (SWIPE) PARA CATEGORÍAS ---
        let touchStartX = 0; let touchStartY = 0; let touchEndX = 0; let touchEndY = 0;
        
        contenedorProductos.addEventListener('touchstart', e => {
            if (!NEGOCIO.deslizarCategorias) return;
            if (e.touches[0].clientX < 24 || e.touches[0].clientX > window.innerWidth - 24) return;
            if (document.body.classList.contains('modal-abierto')) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        contenedorProductos.addEventListener('touchend', e => {
            if (!NEGOCIO.deslizarCategorias || document.body.classList.contains('modal-abierto')) return;
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            const diffX = touchStartX - touchEndX;
            const diffY = Math.abs(touchStartY - touchEndY);
            
            if (Math.abs(diffX) > 60 && Math.abs(diffX) > diffY * 1.5) {
                if (diffX > 0) cambiarCategoriaActiva(categoriaActualIdx + 1);
                else cambiarCategoriaActiva(categoriaActualIdx - 1);
            }
        }, {passive: true});

        // INICIO
        inicializarNegocio(); renderizarFooter(); generarFiltros(); renderizarProductos(productos); actualizarUI();
    </script>
</body>
</html>
